# Secret (DB password, JWT, mail, Cloudinary) nằm trong application-local.properties (không commit).
# Có thể ghi đè bằng biến môi trường, vd: SPRING_DATASOURCE_PASSWORD, APP_JWT_SECRET.
spring.config.import=optional:classpath:application-local.properties

# Profile mặc định là dev; khi deploy đặt SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/project_sell
spring.datasource.username=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.id.new_generator_mappings=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.main.lazy-initialization=true

springdoc.swagger-ui.path=/swagger-ui-custom.html
springdoc.swagger-ui.operationsSorter=method
springdoc.api-docs.path=/api-docs

# VNPay (tmn-code / hash-secret đặt trong application-local.properties)
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html

# Upload ảnh
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB

# Địa chỉ frontend / backend (dùng cho CORS, link trong email, notifyUrl MoMo)
app.frontend-url=http://localhost:5173
app.backend-url=http://localhost:8080
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Đơn online không thanh toán sau N phút sẽ tự hủy và trả hàng về kho
app.order.payment-timeout-minutes=30

# Thời hạn đăng nhập (ms) — 7 ngày
app.jwt.expiration-ms=604800000

# MoMo: dev (sandbox) | prod — key đặt trong environment.properties
momo.env=dev
